name: Refresh IG Access Token

on:
  schedule:
    - cron: "0 3 3 1,3,5,7,9,11 *" # Berjalan setiap 2 bulan jam 3 subuh
  workflow_dispatch: {} # dipicu dari luar oleh cron-job.org

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install libsodium-wrappers

      - name: Refresh token & update secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_ADMIN_PAT: ${{ secrets.GH_ADMIN_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/refresh-ig-token.mjs
