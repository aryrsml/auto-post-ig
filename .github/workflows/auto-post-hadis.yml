name: Posting Hadis IG
on:
  schedule:
    #- cron: "0 0,12 * * *" # 07:00 & 19:00 WIB
    - cron: "3 14 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/post-hadis.js
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CAPTION_HASHTAGS: ${{ vars.CAPTION_HASHTAGS }}
          MAX_HADIS_LEN: ${{ vars.MAX_HADIS_LEN }}
          NODE_ENV: ${{ vars.NODE_ENV }}
